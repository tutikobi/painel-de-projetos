name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    name: Backend (black + migrations + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - name: Migrations em dia com os modelos
        run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  frontend:
    name: Frontend (eslint + prettier + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: Aceitação no navegador (spec H1-H6)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Sobe o backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate
          python manage.py runserver 127.0.0.1:8000 > ../backend.log 2>&1 &

      - name: Sobe o frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite --port 5173 --strictPort > ../frontend.log 2>&1 &

      - name: Espera os servidores
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/tasks/)" = "401" ]; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log frontend.log
          exit 1

      - name: Roda o roteiro de aceitação
        working-directory: e2e
        env:
          E2E_BROWSER_CHANNEL: chrome
          E2E_SCREENSHOTS: screenshots
        run: |
          npm ci
          npm test

      - name: Guarda capturas e logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-debug
          path: |
            e2e/screenshots
            backend.log
            frontend.log
